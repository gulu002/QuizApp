server:
  port: 8080

spring:
  application:
    name: quiz-app
  devtools:
    restart:  # 开启自动重启
      enabled: true
      poll-interval: 500ms  # 监听文件变化的轮询间隔
      quiet-period: 300ms  # 监听文件变化的静默周期
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:quiz_app}?useUnicode=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==}
  expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    com.quizapp: DEBUG
    org.springframework.security: INFO
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG
    org.hibernate.engine.jdbc.connections: DEBUG